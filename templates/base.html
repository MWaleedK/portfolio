
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Portfolio{% endblock %}
    </title>

    {% block css %}
        <link
            rel="stylesheet"
            href="{% static 'css/style.css' %}"
        >
    {% endblock %}
</head>

<body>

    <div class="page">

        {% include "header.html" %}

        <main class="site-content">

            {% block content %}
            {% endblock %}

        </main>

        {% include "footer.html" %}

    </div>

    {% block js %}
        <script src="{% static 'js/script.js' %}"></script>
    {% endblock %}

</body>

</html>
